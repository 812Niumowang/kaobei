<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cd6">
<title>江苏省考备考工作台</title>
<style>
:root{--bg:#f6f2fc;--card:#fff;--tx:#2b2540;--sub:#6e6788;--line:#e4ddf3;--pri:#7c5cd6;--pri-tx:#fff;--soft:#ede7fa;--ok:#2f7d4f;--okbg:#e2f4e9;--bad:#b3341f;--badbg:#fde9e5;--warn:#85600f;--warnbg:#fff3d4}
@media (prefers-color-scheme:dark){:root{--bg:#17131f;--card:#211b2d;--tx:#ece8f6;--sub:#a79fc0;--line:#352d47;--pri:#9d83f0;--pri-tx:#1a1426;--soft:#2c2440;--ok:#6fdc9a;--okbg:#17301f;--bad:#ff9a8a;--badbg:#3a1c18;--warn:#f2cc60;--warnbg:#33290d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
#app{max-width:560px;margin:0 auto;padding:12px 12px calc(84px + env(safe-area-inset-bottom,0px));padding-top:calc(12px + env(safe-area-inset-top,0px))}
h1{font-size:19px;margin:4px 2px 12px;color:var(--pri)}
h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.sub{color:var(--sub);font-size:14px}
.tag{display:inline-block;background:var(--soft);border-radius:999px;padding:2px 10px;font-size:13px;margin:0 6px 6px 0;color:var(--sub)}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.pri{background:var(--pri);color:var(--pri-tx)}
button{font:inherit;border:0;border-radius:12px;min-height:48px;padding:10px 16px;background:var(--soft);color:var(--tx);width:100%;margin-top:8px;font-weight:600;cursor:pointer;display:block;text-align:center}
button.pri{background:var(--pri);color:var(--pri-tx);font-size:17px;min-height:52px}
button.danger{background:var(--badbg);color:var(--bad)}
button.sm{min-height:42px;font-size:15px;width:auto;display:inline-block;margin:6px 6px 0 0;padding:8px 14px}
button.on{background:var(--pri);color:var(--pri-tx)}
button:disabled{opacity:.5}
input,textarea{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);margin-top:4px}
textarea{min-height:80px}
label{display:block;margin-top:10px;font-size:14px;color:var(--sub)}
.row{display:flex;gap:10px}.row>*{flex:1}
.pkg{border-top:1px solid var(--line);padding:10px 0}
.pkg:first-of-type{border-top:0}
.task{font-size:15px;margin:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{margin:0;border-radius:0;background:transparent;min-height:56px;font-size:15px;color:var(--sub);flex:1;width:auto}
nav button.on{color:var(--pri);background:transparent}
.chips label{display:inline-block;margin:6px 6px 0 0;color:var(--tx)}
.chips input{display:none}
.chips span{display:inline-block;padding:8px 12px;border-radius:999px;background:var(--soft);font-size:14px}
.chips input:checked+span{background:var(--pri);color:var(--pri-tx)}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:8px;color:var(--tx);font-size:15px}
.chk input{width:24px;height:24px;margin:2px 0 0;flex:none}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:13px;color:var(--sub);padding:2px 0}
.cell{border-radius:12px;background:var(--soft);min-height:58px;padding:4px 2px;text-align:center;cursor:pointer;border:2px solid transparent;position:relative}
.cell .n{font-size:16px;font-weight:600;line-height:26px;width:26px;height:26px;margin:0 auto;border-radius:50%}
.cell .s{font-size:12px;color:var(--sub);margin-top:2px}
.cell.out{opacity:.4}
.cell.today .n{background:var(--pri);color:var(--pri-tx)}
.cell.today{border-color:var(--pri)}
.cell.sel{border-color:var(--tx)}
.cell.all .s{color:var(--ok);font-weight:700}
.cell.leave{background:var(--warnbg)}
.cell .m{position:absolute;top:2px;right:4px;font-size:11px;color:var(--warn)}
.ov{position:fixed;inset:0;background:rgba(20,10,40,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88%;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.quote{font-size:19px;line-height:1.7;margin:10px 0}
.lock{opacity:.7}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
var RULE = "每包封顶 120 分钟：课程／方法 40 分钟＋限时刷题 40 分钟＋对答案复盘 20 分钟＋回看错题 20 分钟。某包不需要看课，就把时间用于刷题和复盘。";
var LV = [
{ name:"第一关：资料分析", goal:"附件给出的基础线是 25/30（约 85%）；高分经验目标是 25/30（约 85%）以上。先稳准确率，再压速度。",
  pass:"两次不同套题均达到 ≥25/30，且没有靠放弃整篇材料凑正确率。速度未稳定时，继续做 P5/P6，不因看完课程就通关。",
  auto:{pk:["P6"],ratio:25/30,label:"≥25/30",need:2}, manual:["没有靠放弃整篇材料凑正确率"],

  {id:"P2",name:"增长与比重",teacher:"高照",qty:"增长率、增长量、比重专项各一组",qn:null,task:"高照搜 增长率、增长量、现期基期；刷增长率、增长量、比重专项各一组；错题标注“题型判断错／公式错／计算错”。"},
  {id:"P3",name:"平均数与倍数",teacher:"高照",qty:"2 组专项题",qn:null,task:"高照搜 平均数、倍数、比重变化；刷 2 组专项题；每题先写出所求量和已知量关系，再计算。"},
  {id:"P4",name:"综合与比较",teacher:"高照",qty:"3 组混合材料",qn:null,task:"高照搜 资料分析综合题、比较大小；刷 3 组混合材料；训练先看问题、再定位材料、最后选算法。"},
  {id:"P5",name:"速算与估算",teacher:"高照（粉笔做题）",qty:"3 组限时材料",qn:null,task:"高照搜 速算技巧、截位直除、有效数字、估算；粉笔做 3 组限时材料；记录每组正确数和用时。"},
  {id:"P6",name:"真题验收",teacher:"（清单未写老师）",qty:"30 题",qn:30,task:"做近年江苏 A 类资料分析 30 题，限时完成后逐题复盘；隔一包再做另一套。"}]},
{ name:"第二关：判断推理", goal:"范围：图形、定义、逻辑；按要求跳过类比。附件提出过 28/40（70%）的底线，也提出 85% 的高分目标。先以 ≥70% 过基础关，再向 85% 靠拢；题量和模块结构以当年真题为准。",
  pass:"两次混合练习达到 ≥70%；基础稳定后，继续做到 ≥80%，再冲附件的 85% 目标。图推和定义任何一类连续错多题，回到对应包补强。",
  auto:{pk:["P6"],ratio:0.7,label:"≥70%",need:2}, manual:[],
  pkgs:[

  {id:"P2",name:"江苏特色图推",teacher:"花生十三",qty:"每类 10 题",qn:null,task:"花生十三搜 立体拼接、黑白块、四面体、空间重构；每类刷 10 题；错题画出旋转／相邻面关系。"},
  {id:"P3",name:"定义判断",teacher:"花生十三",qty:"30 题",qn:30,task:"花生十三搜 定义判断：关键词、主体、客体、条件、目的；刷 30 题，圈定义中的必要条件和限定词。"},
  {id:"P4",name:"逻辑基础",teacher:"花生十三",qty:"每类 10 题",qn:null,task:"花生十三搜 逻辑判断基础、翻译推理、直言命题；每类刷 10 题，整理“题干关系—选项对应”。"},
  {id:"P5",name:"加强削弱与论证",teacher:"花生十三",qty:"25 题",qn:25,task:"花生十三搜 加强削弱、论证结构、因果论证；刷 25 题，错题注明削弱／加强的是论点、论据还是联系。"},
  {id:"P6",name:"混合验收",teacher:"（清单未写老师）",qty:"江苏 A 类真题图形、定义、逻辑部分（清单未写题数）",qn:null,task:"江苏 A 类真题中图形、定义、逻辑部分限时练习；类比题跳过，不计入本关。"}]},
{ name:"第三关：言语理解", goal:"附件较稳妥的目标是 22/30（约 75%）；高分经验目标为 25/30（约 85%）。先做到题干逻辑清楚、选项有依据，再追速度。",
  pass:"两次套题均 ≥22/30，且主旨、逻辑填空没有明显短板；达标后向 25/30 靠拢。言语别靠“读懂感觉”，每道错题都要指出文中依据或选项逻辑问题。",
  auto:{pk:["P5","P6"],ratio:22/30,label:"≥22/30",need:2}, manual:["主旨、逻辑填空没有明显短板"],
  pkgs:[
  {id:"P1",name:"主旨与中心句",teacher:"郭熙",qty:"25 题",qn:25,task:"郭熙搜 言语理解 主旨概括、中心句、行文脉络；粉笔刷 25 题，答案必须能回到原文定位。"},
  {id:"P2",name:"逻辑填空",teacher:"郭熙；红领巾（辅助）",qty:"25 题",qn:25,task:"郭熙搜 逻辑填空：语境分析、关联词、上下文照应；红领巾搜 逻辑填空词语辨析／高频词语作辅助；刷 25 题，错词记搭配和语境。"},
  {id:"P3",name:"意图与标题",teacher:"郭熙",qty:"20 题",qn:20,task:"郭熙搜 意图判断、标题选择、主旨题区别；刷 20 题，标出作者态度、问题和对策。"},
  {id:"P4",name:"细节与语句",teacher:"郭熙",qty:"混合 25 题",qn:25,task:"郭熙搜 细节判断、语句排序、语句填空；刷各类题混合 25 题，复盘偷换概念、无中生有、逻辑断裂。"},
  {id:"P5",name:"混合限时",teacher:"（清单未写老师）",qty:"30 题",qn:30,task:"江苏 A 类言语真题 30 题限时做；每题记录是否能在约 40 秒内确定思路，超时题标记回看。"},
  {id:"P6",name:"真题复测",teacher:"（清单未写老师）",qty:"30 题",qn:30,task:"换一套江苏 A 类言语 30 题；只复盘错题和犹豫题，不重刷已稳定题。"}]},
{ name:"第四关：申论小题", goal:"范围：只练审题、找点、划材料、归纳表达；不写大作文。没有把握附件里的分数线套用到申论小题，按采点完整度验收。",
  pass:"每题都能在材料中给每个答案要点找到依据；同一题重做时，能找回参考答案中的大部分采分点。验收以“是否漏点、是否有材料依据”为主，不要求在此关写完整作文。",
  auto:null, manual:["每题都能在材料中给每个答案要点找到依据","同一题重做时，能找回参考答案中的大部分采分点"],
  pkgs:[
  {id:"P1",name:"审题与材料定位",teacher:"郭熙",qty:"3 题（只划材料、不作答）",qn:3,task:"郭熙搜 申论小题 审题、问法识别、材料定位；用江苏真题材料练 3 题，只划材料、不作答；标出对象、范围、任务词。"},
  {id:"P2",name:"概括题",teacher:"郭熙",qty:"2 题",qn:2,task:"郭熙搜 归纳概括题 找点、合并同类项；练 2 题，先划点再按要点类别列关键词。"},
  {id:"P3",name:"对策题",teacher:"郭熙",qty:"2 题",qn:2,task:"郭熙搜 提出对策题 问题—原因—对策；练 2 题，材料已有对策优先摘取，避免脱离材料发挥。"},
  {id:"P4",name:"分析题",teacher:"郭熙",qty:"2 题",qn:2,task:"郭熙搜 综合分析题 解释型、评论型；练 2 题，标出解释对象、原因、影响、结论。"},
  {id:"P5",name:"应用文",teacher:"郭熙",qty:"2 题",qn:2,task:"郭熙搜 贯彻执行题 格式、对象、内容要点；练 2 题，只列格式和内容提纲，再对照参考答案查漏。"},
  {id:"P6",name:"采点复盘",teacher:"（清单未写老师）",qty:"4 题",qn:4,task:"从做过的题里选 4 题，遮住答案重新划点；把遗漏点归为“漏材料、漏对象、合并不当、表达不清”。"}]},

  pass:"作文提纲能回应题目、分论点互不重复、每点有材料或现实依据；常识两次小测达到 ≥12/20。若低于 60%，只回看错题所属主题，不整本重学。",
  auto:{pk:["P5","P6"],ratio:12/20,label:"常识 ≥12/20",need:2}, manual:["作文提纲能回应题目、分论点互不重复、每点有材料或现实依据"],
  pkgs:[

  {id:"P2",name:"文章结构",teacher:"郭熙",qty:"一个开头、一个分论点段",qn:null,task:"郭熙搜 申论大作文 开头、分论点展开、结尾；写一个开头、一个分论点段，不求整篇。"},
  {id:"P3",name:"江苏主题素材",teacher:"（清单未写老师）",qty:"（清单未写题数）",qn:null,task:"整理可核实的江苏主题词：“强富美高”、高质量发展、长江经济带、长三角一体化、制造强省、乡村全面振兴；练习把主题词对应到题目材料，不把词语硬塞进文章。"},
  {id:"P4",name:"新质生产力",teacher:"（清单未写老师）",qty:"用其中 2 点搭一份提纲",qn:null,task:"搜当年权威政策解读和江苏省级公开材料，整理 科技创新、产业创新、传统产业升级、先进制造业集群、人才支撑的材料例子；用其中 2 点搭一份提纲。"},

  {id:"P2",name:"工程与行程",teacher:"花生十三",qty:"每类 8 道",qn:null,task:"花生十三搜 工程问题、行程问题基础；每类做 8 道，能快速列式的保留，卡住就看解析。"},
  {id:"P3",name:"经济与比例",teacher:"花生十三",qty:"每类 6–8 道",qn:null,task:"花生十三搜 利润、浓度、比例、基础排列组合；每类做 6–8 道，只练基础问法。"},

function norm(d){
  var s=fresh(); if(!d||!Array.isArray(d.attempts)) return s;
  s.attempts=d.attempts.map(function(a){a.date=a.date||ds(new Date(a.end||Date.now()));return a;});
  s.manual=d.manual||{}; s.done=d.done||{}; s.dayDone=d.dayDone||{}; s.leaves=d.leaves||{}; s.quotesUsed=d.quotesUsed||[];
  if(typeof d.start==="string") s.start=d.start;

  return s;
}

/* ===== 排课：按清单顺序，周一至周六各一个包，周日休息；漏学按自然日顺延 ===== */
function schedule(){
  var items={}, moved={}, d=S.start, i;
  for(i=0;i<T.length;i++){
    while(dow(d)===0) d=add(d,1);
    (items[d]=items[d]||[]).push({t:i,kind:"plan"});
    d=add(d,1);
  }
  var ls=Object.keys(S.leaves).sort(), blocks=[], cur=null;
  ls.forEach(function(x){ if(cur && add(cur.e,1)===x) cur.e=x; else { cur={s:x,e:x}; blocks.push(cur); } });
  blocks.forEach(function(b){
    var n=0, x=b.s;
    while(x<=b.e){
      var target=add(b.e,1+n), keep=[];
      (items[x]||[]).forEach(function(it){
        var dn=S.done[T[it.t].key];
        if(dn && dn.date<=x) keep.push(it);
        else{
          (moved[x]=moved[x]||[]).push({t:it.t,to:target});
          var arr=items[target]=items[target]||[], pos=0;
          while(pos<arr.length && arr[pos].kind==="makeup") pos++;
          arr.splice(pos,0,{t:it.t,kind:"makeup",from:x});
        }
      });
      items[x]=keep; n++; x=add(x,1);
    }
  });
  return {items:items,moved:moved};
}
function whereIs(sc,ti){ var k; for(k in sc.items){ for(var j=0;j<sc.items[k].length;j++) if(sc.items[k][j].t===ti) return k; } return null; }
function lateDays(sc){
  var t=today(), out=[];
  Object.keys(sc.items).sort().forEach(function(d){
    if(d>=t||S.leaves[d]) return;
    if(sc.items[d].some(function(it){return !isDone(T[it.t].key);})) out.push(d);
  });
  return out;
}
function cleanDayDone(){
  var sc=schedule();
  Object.keys(S.dayDone).forEach(function(d){
    var its=sc.items[d]||[];
    if(!its.length || !its.every(function(it){return isDone(T[it.t].key);})) delete S.dayDone[d];
  });
}

function lvStatus(i){

  var allDone=done===lv.pkgs.length, autoOk=true, recent=[];
  if(lv.auto){
    var list=S.attempts.filter(function(a){return a.L===i && lv.auto.pk.indexOf(a.P)>=0 && a.total>0;}).sort(function(a,b){return a.end-b.end;});
    recent=list.slice(-lv.auto.need);
    autoOk=recent.length>=lv.auto.need && recent.every(function(a){return a.correct/a.total>=lv.auto.ratio-1e-9;});
  }
  var mk=S.manual[i]||[], manualOk=lv.manual.every(function(_,j){return !!mk[j];});
  return {done:done,allDone:allDone,autoOk:autoOk,recent:recent,manualOk:manualOk,passed:allDone&&autoOk&&manualOk};
}

    }else if(d<=t) h+='<button class="pri" data-act="done" data-key="'+x.key+'" data-d="'+d+'">标记完成</button>';
    else h+='<div class="sub">还没到这一天，到了再标记。</div>';
    h+='</div>';
  });
  if(!its.length && !mv.length) h+='<div class="card sub">这天没有安排。</div>';
  return h;
}

/* ===== 视图：关卡 ===== */
function vLevels(){
  var cl=curLevel(), sc=schedule(), h="";
  LV.forEach(function(lv,i){
    var st=lvStatus(i);
    h+='<div class="card"><div data-act="open" data-i="'+i+'" style="cursor:pointer"><h2>'+esc(lv.name)+'</h2><div class="bar"></div>'+
      '<span class="tag">'+st.done+' / '+lv.pkgs.length+' 包</span>'+(st.passed?'<span class="tag ok">已通关</span>':(i===cl?'<span class="tag warn">当前关卡</span>':(i>cl?'<span class="tag">未到</span>':'<span class="tag bad">未通关</span>')))+
      (lv.auto?(st.recent.length?'<span class="tag '+(st.autoOk?'ok':'bad')+'">'+(st.autoOk?'成绩达标':'成绩未达标')+'</span>':'<span class="tag">暂无验收成绩</span>'):'')+'</div>';
    if(ui.open===i){
      h+='<div class="sub">'+esc(lv.goal)+'</div><div class="task"><b>通关：</b>'+esc(lv.pass)+'</div>';
      if(lv.auto) h+='<div class="task">自动判定：'+esc(lv.auto.pk.join("／"))+' 的成绩，最近 '+lv.auto.need+' 次均 '+esc(lv.auto.label)+'。'+(st.recent.length?'最近：'+st.recent.map(function(a){return a.correct+"/"+a.total+(a.correct/a.total>=lv.auto.ratio-1e-9?"✓":"✗");}).join("，"):'')+'</div>';
      if(lv.auto && !st.autoOk && st.recent.length) h+='<div class="note">未达标：只回看对应错题，或重做 '+esc(lv.auto.pk.join("／"))+'，不跳关。</div>';
      if(lv.manual.length){ h+='<div style="margin-top:8px"><b>自查项（达到后勾选）</b></div>'; lv.manual.forEach(function(m,j){ h+='<label class="chk"><input type="checkbox" data-act="manual" data-i="'+i+'" data-j="'+j+'"'+((S.manual[i]||[])[j]?' checked':'')+'><span>'+esc(m)+'</span></label>'; }); }
      lv.pkgs.forEach(function(p,k){
        var key=i+"-"+p.id, dn=isDone(key), ti=i*0, wd=null, q;
        for(q=0;q<T.length;q++) if(T[q].key===key) wd=whereIs(sc,q);
        h+='<div class="pkg"><b>'+esc(p.id+" "+p.name)+'</b> '+(dn?'<span class="tag ok">已完成</span>':'<span class="tag">未完成</span>')+(wd?'<span class="tag">安排在 '+md(wd)+'</span>':'')+
          '<div class="sub">老师：'+esc(p.teacher)+'｜题量：'+esc(p.qty)+'</div><div class="task">'+esc(p.task)+'</div>';
        S.attempts.filter(function(a){return a.L===i&&a.P===p.id;}).forEach(function(a){ h+='<div class="sub">· '+tm(a.end)+(a.redo?'（重做）':'')+'｜'+(a.total>0?a.correct+'/'+a.total:'—')+(a.reasons&&a.reasons.length?'｜'+esc(a.reasons.join("、")):'')+'</div>'; });
        if(dn) h+='<button class="sm" data-act="redo" data-key="'+key+'">记录一次重做</button>';
        h+='</div>';
      });
    }
    h+='</div>';
  });
  return h;
}

/* ===== 视图：记录 / 设置 ===== */
function vRecords(){
  var h='<div class="card"><h2>学习记录</h2>';
  if(!S.attempts.length) h+='<div class="sub">还没有记录。</div>';
  S.attempts.slice().reverse().forEach(function(a){
    var p=LV[a.L]&&LV[a.L].pkgs.filter(function(q){return q.id===a.P;})[0];
    h+='<div class="pkg"><b>'+esc((LV[a.L]?LV[a.L].name.split("：")[0]:"")+" "+a.P+" "+(p?p.name:""))+'</b>'+(a.redo?' <span class="tag">重做</span>':'')+
      '<div class="sub">完成时间 '+tm(a.end)+(a.planDate?'｜所在日期 '+md(a.planDate):'')+'</div>'+
      '<div class="sub">题量 '+(a.total||0)+'｜正确 '+(a.correct||0)+(a.total>0?'（'+Math.round(a.correct/a.total*100)+'%）':'')+'</div>'+
      (a.reasons&&a.reasons.length?'<div class="sub">错因：'+esc(a.reasons.join("、"))+'</div>':'')+(a.note?'<div class="sub">备注：'+esc(a.note)+'</div>':'')+
      '<button class="sm danger" data-act="del-att" data-id="'+a.id+'">删除</button></div>';
  });
  h+='</div><div class="card"><h2>当天完成记录</h2>';
  var ks=Object.keys(S.dayDone).sort().reverse();
  if(!ks.length) h+='<div class="sub">还没有。</div>';
  ks.forEach(function(d){ h+='<div class="sub">'+full(d)+' 全部完成于 '+tm(S.dayDone[d].ts)+'</div>'; });
  return h+'</div>';
}
function vSettings(){
  return '<div class="card"><h2>排课起点</h2><div class="sub">按清单顺序，从这一天起周一至周六各排一个任务包，周日休息。</div><label>开始日期</label><input type="date" id="st-d" value="'+S.start+'"><button data-act="set-start">修改开始日期</button></div>'+
    '<div class="card"><h2>数据与备份</h2><div class="note" style="margin-top:0">所有数据只保存在这台设备的这个浏览器里。清除浏览器数据或换设备会丢失，请定期导出备份。'+(memOnly?'<br><b>当前浏览器无法写入本地存储（可能是无痕模式），关闭页面后数据会丢失。</b>':'')+'</div>'+
    '<button class="pri" data-act="export">导出 JSON 备份</button><button data-act="copy">复制 JSON 到剪贴板</button>'+
    '<label>导入备份（选择之前导出的 JSON 文件，会覆盖当前数据）</label><input type="file" id="imp" accept=".json,application/json">'+
    '<label>或把 JSON 文本粘贴到这里再点导入</label><textarea id="imp-t">'+esc(ui.backupText)+'</textarea><button data-act="import-text">导入粘贴的内容</button>'+
    (ui.msg?'<div class="note">'+esc(ui.msg)+'</div>':'')+'</div>'+
    '<div class="card"><h2>规则提醒</h2><div class="sub">清单建议的单包分配：课程／方法 40 分钟＋限时刷题 40 分钟＋对答案复盘 20 分钟＋回看错题 20 分钟。现在不计时、不设时长上限，完成当天原定任务即算完成。<br>漏学不会被当作已完成：未完成的任务会按日期顺序加到复学后的接下来每一天。<br>通关看正确率：没达标就回看错题或重做对应包，不跳关。</div>'+
    '<button class="danger" data-act="reset">清空全部数据</button></div>';
}

/* ===== 弹层与总渲染 ===== */
function reasonsHtml(){ return REASONS.map(function(r){return '<label><input type="checkbox" value="'+r+'"><span>'+r+'</span></label>';}).join(""); }
function vModal(){
  if(ui.modal){
    return '<div class="ov"><div class="sheet"><div class="sub">今天的任务完成了</div><div class="quote">'+esc(ui.modal.t)+'</div>'+(ui.modal.by?'<div class="sub">——'+esc(ui.modal.by)+'</div>':'')+'<button class="pri" data-act="modal-ok">好</button></div></div>';
  }
  if(ui.form){
    var x=T[tIdxOf(ui.form.key)], p=x.p;
    return '<div class="ov"><div class="sheet"><h2>'+(ui.form.redo?'记录一次重做：':'完成：')+esc(p.id+" "+p.name)+'</h2><div class="sub">下面都可以不填，直接点保存。</div>'+
      '<div class="row"><div><label>题量</label><input id="f-total" type="number" inputmode="numeric" min="0" value="'+(p.qn!=null?p.qn:"")+'"></div><div><label>正确数</label><input id="f-cor" type="number" inputmode="numeric" min="0"></div></div>'+
      '<label>错因（可多选）</label><div class="chips" id="f-rs">'+reasonsHtml()+'</div><label>备注</label><textarea id="f-note"></textarea>'+
      '<button class="pri" data-act="form-save">保存</button><button data-act="form-cancel">取消</button></div></div>';
  }
  return "";
}
function tIdxOf(key){ for(var i=0;i<T.length;i++) if(T[i].key===key) return i; return 0; }
function render(){
  var v=ui.tab==="levels"?vLevels():ui.tab==="records"?vRecords():ui.tab==="settings"?vSettings():(ui.sel?vDay():vCal());
  var tabs=[["cal","日历"],["levels","关卡"],["records","记录"],["settings","设置"]];
  document.getElementById("app").innerHTML='<h1>江苏省考备考工作台</h1>'+v+
    '<nav>'+tabs.map(function(t){return '<button data-act="tab" data-t="'+t[0]+'" class="'+(ui.tab===t[0]?"on":"")+'">'+t[1]+'</button>';}).join("")+'</nav>'+vModal();
}

/* ===== 操作 ===== */
function dl(name,text,type){
  var b=new Blob([text],{type:type+";charset=utf-8"}), a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
}
function doImport(txt){
  try{
    var d=JSON.parse(txt); if(!d||!Array.isArray(d.attempts)) throw new Error("x");
    if(!confirm("导入会覆盖当前全部数据，确定吗？")) return;
    S=norm(d); save(); ui.msg="导入成功。"; render();
  }catch(e){ ui.msg="导入失败：不是有效的备份文件。"; render(); }
}
function registerLeave(dates){ dates.forEach(function(d){S.leaves[d]=1;}); save(); }
function saveForm(){
  var f=ui.form, x=T[tIdxOf(f.key)];
  var total=parseInt(document.getElementById("f-total").value,10), cor=parseInt(document.getElementById("f-cor").value,10);
  if(isNaN(total)) total=0; if(isNaN(cor)) cor=0;
  if(total<0||cor<0||cor>total){ alert("正确数不能大于题量，也不能为负数。"); return; }
  var rs=[].slice.call(document.querySelectorAll("#f-rs input:checked")).map(function(e){return e.value;});
  var now=Date.now();
  S.attempts.push({id:now,L:x.L,P:x.p.id,end:now,date:ds(new Date(now)),planDate:f.d||null,total:total,correct:cor,reasons:rs,note:document.getElementById("f-note").value.trim(),redo:!!f.redo});
  var quote=null;
  if(!f.redo){
    S.done[f.key]={date:today(),ts:now};
    var its=schedule().items[f.d]||[];
    if(f.d && its.length && its.every(function(it){return isDone(T[it.t].key);}) && !S.dayDone[f.d]){ quote=pickQuote(); S.dayDone[f.d]={ts:now,q:quote.t}; }
  }
  save(); ui.form=null; ui.modal=quote; render();
}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]"); if(!el) return;
  var a=el.getAttribute("data-act"), g=function(n){return el.getAttribute("data-"+n);};
  if(a==="manual") return;
  if(a==="tab"){ ui.tab=el.getAttribute("data-t"); ui.msg=""; if(ui.tab==="cal") ui.sel=ui.sel; }
  else if(a==="view"){ ui.view=g("v"); }
  else if(a==="nav"){ var n=+g("n"); if(ui.view==="week") ui.focus=add(ui.focus,7*n); else { var d=pd(ui.focus); ui.focus=ds(new Date(d.getFullYear(),d.getMonth()+n,1)); } }
  else if(a==="today"){ ui.focus=today(); ui.sel=null; }
  else if(a==="sel"){ ui.sel=g("d"); ui.dflt="all"; ui.tab="cal"; window.scrollTo(0,0); }
  else if(a==="back"){ ui.sel=null; }
  else if(a==="flt"){ ui.flt=g("f"); }
  else if(a==="dflt"){ ui.dflt=g("f"); }
  else if(a==="open"){ var i=+g("i"); ui.open=ui.open===i?-1:i; }
  else if(a==="leave-toggle"){ ui.leaveOpen=!ui.leaveOpen; }
  else if(a==="leave-add"){
    var s=document.getElementById("lv-s").value, en=document.getElementById("lv-e").value;
    if(!s||!en||en<s){ alert("请选好开始和结束日期（结束不能早于开始）。"); return; }
    var ds_=[], x=s; while(x<=en && ds_.length<90){ ds_.push(x); x=add(x,1); }
    if(!confirm("登记 "+md(s)+" 至 "+md(en)+" 共 "+ds_.length+" 天请假／漏学？这些天没完成的任务会顺延到复学后的接下来每一天。")) return;
    registerLeave(ds_); ui.leaveOpen=false;
  }
  else if(a==="leave-del"){
    var s2=g("s"), e2=g("e"); if(!confirm("取消 "+md(s2)+" 至 "+md(e2)+" 的请假登记？顺延的任务会回到原来的日期。")) return;
    var y=s2; while(y<=e2){ delete S.leaves[y]; y=add(y,1); } save();
  }
  else if(a==="leave-day"){ if(!confirm("把 "+full(g("d"))+" 登记为请假／漏学？这天没完成的任务会顺延。")) return; registerLeave([g("d")]); }
  else if(a==="leave-day-del"){ if(!confirm("取消 "+full(g("d"))+" 的请假登记？")) return; delete S.leaves[g("d")]; save(); }
  else if(a==="late-reg"){
    var late=lateDays(schedule());
    if(!confirm("把 "+late.map(md).join("、")+" 登记为漏学？没完成的任务会按顺序加到复学后的接下来每一天，不会被当作完成。")) return;
    registerLeave(late);
  }
  else if(a==="done"){ ui.form={key:g("key"),d:g("d"),redo:false}; }
  else if(a==="redo"){ ui.form={key:g("key"),d:null,redo:true}; }
  else if(a==="form-save"){ saveForm(); return; }
  else if(a==="form-cancel"){ ui.form=null; }
  else if(a==="modal-ok"){ ui.modal=null; }
  else if(a==="undo"){
    if(!confirm("撤销这项的完成状态？它的完成记录（正确数、错因、备注）也会一并删除。")) return;
    var key=g("key"); delete S.done[key];
    S.attempts=S.attempts.filter(function(q){return !(q.L+"-"+q.P===key && !q.redo);});
    cleanDayDone(); save();
  }
  else if(a==="del-att"){
    if(!confirm("删除这条记录？如果它是该任务包的完成记录，该包会变回未完成。")) return;
    var id=+g("id"), at=S.attempts.filter(function(q){return q.id===id;})[0];
    S.attempts=S.attempts.filter(function(q){return q.id!==id;});
    if(at && !at.redo){ var k2=at.L+"-"+at.P; if(!S.attempts.some(function(q){return q.L+"-"+q.P===k2&&!q.redo;})) delete S.done[k2]; }
    cleanDayDone(); save();
  }
  else if(a==="set-start"){
    var v=document.getElementById("st-d").value; if(!v) return;
    if(!confirm("把开始日期改为 "+full(v)+"？整个排课会按新日期重排，已完成的记录不会丢。")) return;
    S.start=v; save(); ui.msg="已修改。";
  }
  else if(a==="export"){ dl("kaobei-backup-"+today()+".json",JSON.stringify(S,null,2),"application/json"); return; }
  else if(a==="copy"){ var t=JSON.stringify(S); if(navigator.clipboard){ navigator.clipboard.writeText(t).then(function(){ui.msg="已复制。";render();},function(){ui.backupText=t;ui.msg="无法自动复制，已把内容放进下方文本框，请手动全选复制。";render();}); } else { ui.backupText=t; ui.msg="已把内容放进下方文本框，请手动全选复制。"; render(); } return; }
  else if(a==="import-text"){ doImport(document.getElementById("imp-t").value); return; }
  else if(a==="reset"){ if(confirm("确定清空全部数据？此操作不可恢复，建议先导出备份。")&&confirm("再确认一次：真的清空吗？")){ S=fresh(); save(); ui.msg="已清空。"; ui.sel=null; } }
  render();
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.getAttribute && el.getAttribute("data-act")==="manual"){
    var i=+el.getAttribute("data-i"), j=+el.getAttribute("data-j");
    S.manual[i]=S.manual[i]||[]; S.manual[i][j]=el.checked; save(); render(); return;
  }
  if(el.id==="imp" && el.files && el.files[0]){ var r=new FileReader(); r.onload=function(){doImport(String(r.result));}; r.readAsText(el.files[0]); }
});
load(); render();
</script>
</body>
</html>
