<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>备考工作台｜江苏淮安 A 类岗</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1c2430;--sub:#5d6877;--line:#e1e6ee;--pri:#1f6feb;--pri-tx:#fff;--ok:#1a7f37;--okbg:#e3f5e8;--bad:#b42318;--badbg:#fde8e6;--warn:#8a5a00;--warnbg:#fff4d6;--chip:#eef1f6}
@media (prefers-color-scheme:dark){:root{--bg:#10141b;--card:#1a212c;--tx:#e8edf4;--sub:#9aa6b6;--line:#2a3442;--pri:#4c8dff;--pri-tx:#fff;--ok:#56d364;--okbg:#14301d;--bad:#ff8b80;--badbg:#3a1a17;--warn:#f2cc60;--warnbg:#33290d;--chip:#242d3a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
#app{max-width:560px;margin:0 auto;padding:12px 12px calc(84px + env(safe-area-inset-bottom,0px));padding-top:calc(12px + env(safe-area-inset-top,0px))}
h1{font-size:19px;margin:4px 2px 12px}
h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.sub{color:var(--sub);font-size:14px}
.tag{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:13px;margin:0 6px 6px 0;color:var(--sub)}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.warn{background:var(--warnbg);color:var(--warn)}
button,.btn{font:inherit;border:0;border-radius:12px;min-height:50px;padding:12px 16px;background:var(--chip);color:var(--tx);width:100%;margin-top:8px;font-weight:600;cursor:pointer;display:block;text-align:center}
button.pri{background:var(--pri);color:var(--pri-tx);font-size:18px;min-height:56px}
button.danger{background:var(--badbg);color:var(--bad)}
button.sm{min-height:44px;font-size:15px;width:auto;display:inline-block;margin:6px 6px 0 0;padding:8px 14px}
button:disabled{opacity:.45}
input,textarea,select{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);margin-top:4px}
textarea{min-height:80px}
label{display:block;margin-top:10px;font-size:14px;color:var(--sub)}
.row{display:flex;gap:10px}.row>*{flex:1}
.timer{font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;margin:6px 0 10px}
.bar>i{display:block;height:100%;background:var(--pri)}
.pkg{border-top:1px solid var(--line);padding:10px 0}
.pkg:first-of-type{border-top:0}
.task{font-size:15px;margin:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{margin:0;border-radius:0;background:transparent;min-height:56px;font-size:15px;color:var(--sub);flex:1;width:auto}
nav button.on{color:var(--pri)}
.chips label{display:inline-block;margin:6px 6px 0 0;color:var(--tx)}
.chips input{display:none}
.chips span{display:inline-block;padding:8px 12px;border-radius:999px;background:var(--chip);font-size:14px}
.chips input:checked+span{background:var(--pri);color:var(--pri-tx)}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:8px;color:var(--tx);font-size:15px}
.chk input{width:24px;height:24px;margin:2px 0 0;flex:none}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.lock{opacity:.6}
</style>
</head>
<body>
<div id="app"></div>

var RULE = "每包封顶 120 分钟：课程／方法 40 分钟＋限时刷题 40 分钟＋对答案复盘 20 分钟＋回看错题 20 分钟。某包不需要看课，就把时间用于刷题和复盘。";
var LV = [
{ name:"第一关：资料分析", goal:"附件给出的基础线是 25/30（约 85%）；高分经验目标是 25/30（约 85%）以上。先稳准确率，再压速度。",
  pass:"两次不同套题均达到 ≥25/30，且没有靠放弃整篇材料凑正确率。速度未稳定时，继续做 P5/P6，不因看完课程就通关。",
  auto:{pk:["P6"],ratio:25/30,label:"≥25/30",need:2}, manual:["没有靠放弃整篇材料凑正确率"],

  {id:"P2",name:"增长与比重",teacher:"高照",qty:"增长率、增长量、比重专项各一组",qn:null,task:"高照搜 增长率、增长量、现期基期；刷增长率、增长量、比重专项各一组；错题标注“题型判断错／公式错／计算错”。"},
  {id:"P3",name:"平均数与倍数",teacher:"高照",qty:"2 组专项题",qn:null,task:"高照搜 平均数、倍数、比重变化；刷 2 组专项题；每题先写出所求量和已知量关系，再计算。"},
  {id:"P4",name:"综合与比较",teacher:"高照",qty:"3 组混合材料",qn:null,task:"高照搜 资料分析综合题、比较大小；刷 3 组混合材料；训练先看问题、再定位材料、最后选算法。"},
  {id:"P5",name:"速算与估算",teacher:"高照（粉笔做题）",qty:"3 组限时材料",qn:null,task:"高照搜 速算技巧、截位直除、有效数字、估算；粉笔做 3 组限时材料；记录每组正确数和用时。"},
  {id:"P6",name:"真题验收",teacher:"（清单未写老师）",qty:"30 题",qn:30,task:"做近年江苏 A 类资料分析 30 题，限时完成后逐题复盘；隔一包再做另一套。"}]},
{ name:"第二关：判断推理", goal:"范围：图形、定义、逻辑；按要求跳过类比。附件提出过 28/40（70%）的底线，也提出 85% 的高分目标。先以 ≥70% 过基础关，再向 85% 靠拢；题量和模块结构以当年真题为准。",
  pass:"两次混合练习达到 ≥70%；基础稳定后，继续做到 ≥80%，再冲附件的 85% 目标。图推和定义任何一类连续错多题，回到对应包补强。",
  auto:{pk:["P6"],ratio:0.7,label:"≥70%",need:2}, manual:[],
  pkgs:[
  {id:"P1",name:"图形规律",teacher:"花生十三",qty:"20 道分类题",qn:20,task:"花生十三搜 图形推理基础：位置、样式、数量、属性、空间；粉笔做 20 道分类题，逐题写规律。"},
  {id:"P2",name:"江苏特色图推",teacher:"花生十三",qty:"每类 10 题",qn:null,task:"花生十三搜 立体拼接、黑白块、四面体、空间重构；每类刷 10 题；错题画出旋转／相邻面关系。"},
  {id:"P3",name:"定义判断",teacher:"花生十三",qty:"30 题",qn:30,task:"花生十三搜 定义判断：关键词、主体、客体、条件、目的；刷 30 题，圈定义中的必要条件和限定词。"},
  {id:"P4",name:"逻辑基础",teacher:"花生十三",qty:"每类 10 题",qn:null,task:"花生十三搜 逻辑判断基础、翻译推理、直言命题；每类刷 10 题，整理“题干关系—选项对应”。"},
  {id:"P5",name:"加强削弱与论证",teacher:"花生十三",qty:"25 题",qn:25,task:"花生十三搜 加强削弱、论证结构、因果论证；刷 25 题，错题注明削弱／加强的是论点、论据还是联系。"},
  {id:"P6",name:"混合验收",teacher:"（清单未写老师）",qty:"江苏 A 类真题图形、定义、逻辑部分（清单未写题数）",qn:null,task:"江苏 A 类真题中图形、定义、逻辑部分限时练习；类比题跳过，不计入本关。"}]},
{ name:"第三关：言语理解", goal:"附件较稳妥的目标是 22/30（约 75%）；高分经验目标为 25/30（约 85%）。先做到题干逻辑清楚、选项有依据，再追速度。",
  pass:"两次套题均 ≥22/30，且主旨、逻辑填空没有明显短板；达标后向 25/30 靠拢。言语别靠“读懂感觉”，每道错题都要指出文中依据或选项逻辑问题。",

  {id:"P1",name:"主旨与中心句",teacher:"郭熙",qty:"25 题",qn:25,task:"郭熙搜 言语理解 主旨概括、中心句、行文脉络；粉笔刷 25 题，答案必须能回到原文定位。"},
  {id:"P2",name:"逻辑填空",teacher:"郭熙；红领巾（辅助）",qty:"25 题",qn:25,task:"郭熙搜 逻辑填空：语境分析、关联词、上下文照应；红领巾搜 逻辑填空词语辨析／高频词语作辅助；刷 25 题，错词记搭配和语境。"},
  {id:"P3",name:"意图与标题",teacher:"郭熙",qty:"20 题",qn:20,task:"郭熙搜 意图判断、标题选择、主旨题区别；刷 20 题，标出作者态度、问题和对策。"},
  {id:"P4",name:"细节与语句",teacher:"郭熙",qty:"混合 25 题",qn:25,task:"郭熙搜 细节判断、语句排序、语句填空；刷各类题混合 25 题，复盘偷换概念、无中生有、逻辑断裂。"},
  {id:"P5",name:"混合限时",teacher:"（清单未写老师）",qty:"30 题",qn:30,task:"江苏 A 类言语真题 30 题限时做；每题记录是否能在约 40 秒内确定思路，超时题标记回看。"},
  {id:"P6",name:"真题复测",teacher:"（清单未写老师）",qty:"30 题",qn:30,task:"换一套江苏 A 类言语 30 题；只复盘错题和犹豫题，不重刷已稳定题。"}]},

  pass:"每题都能在材料中给每个答案要点找到依据；同一题重做时，能找回参考答案中的大部分采分点。验收以“是否漏点、是否有材料依据”为主，不要求在此关写完整作文。",
  auto:null, manual:["每题都能在材料中给每个答案要点找到依据","同一题重做时，能找回参考答案中的大部分采分点"],
  pkgs:[
  {id:"P1",name:"审题与材料定位",teacher:"郭熙",qty:"3 题（只划材料、不作答）",qn:3,task:"郭熙搜 申论小题 审题、问法识别、材料定位；用江苏真题材料练 3 题，只划材料、不作答；标出对象、范围、任务词。"},
  {id:"P2",name:"概括题",teacher:"郭熙",qty:"2 题",qn:2,task:"郭熙搜 归纳概括题 找点、合并同类项；练 2 题，先划点再按要点类别列关键词。"},
  {id:"P3",name:"对策题",teacher:"郭熙",qty:"2 题",qn:2,task:"郭熙搜 提出对策题 问题—原因—对策；练 2 题，材料已有对策优先摘取，避免脱离材料发挥。"},
  {id:"P4",name:"分析题",teacher:"郭熙",qty:"2 题",qn:2,task:"郭熙搜 综合分析题 解释型、评论型；练 2 题，标出解释对象、原因、影响、结论。"},
  {id:"P5",name:"应用文",teacher:"郭熙",qty:"2 题",qn:2,task:"郭熙搜 贯彻执行题 格式、对象、内容要点；练 2 题，只列格式和内容提纲，再对照参考答案查漏。"},
  {id:"P6",name:"采点复盘",teacher:"（清单未写老师）",qty:"4 题",qn:4,task:"从做过的题里选 4 题，遮住答案重新划点；把遗漏点归为“漏材料、漏对象、合并不当、表达不清”。"}]},

  auto:{pk:["P5","P6"],ratio:12/20,label:"常识 ≥12/20",need:2}, manual:["作文提纲能回应题目、分论点互不重复、每点有材料或现实依据"],
  pkgs:[

  {id:"P2",name:"文章结构",teacher:"郭熙",qty:"一个开头、一个分论点段",qn:null,task:"郭熙搜 申论大作文 开头、分论点展开、结尾；写一个开头、一个分论点段，不求整篇。"},

  {id:"P4",name:"新质生产力",teacher:"（清单未写老师）",qty:"用其中 2 点搭一份提纲",qn:null,task:"搜当年权威政策解读和江苏省级公开材料，整理 科技创新、产业创新、传统产业升级、先进制造业集群、人才支撑的材料例子；用其中 2 点搭一份提纲。"},

var REASONS = ["找错数","看错单位","漏看时间范围","题型判断错","公式错","计算错","漏材料","漏对象","合并不当","表达不清","知识不会","读题失误","计算失误","时间不够"];
var LIMIT = 120*60000;
var KEY = "kaobei-workbench-v1";

/* ========== 状态与本地保存 ========== */
var S, memOnly = false;
function fresh(){ return {v:1, attempts:[], manual:{}, sess:null, travel:null, wake:null}; }
function load(){
  try{ var r = localStorage.getItem(KEY); S = r ? JSON.parse(r) : fresh(); }catch(e){ S = fresh(); memOnly = true; }
  if(!S || !Array.isArray(S.attempts)) S = fresh();
  S.manual = S.manual || {};
  if(S.sess && S.sess.since){ S.sess.accum += Math.max(0,(S.sess.beat||S.sess.since)-S.sess.since); S.sess.since = null; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); memOnly = false; }catch(e){ memOnly = true; } }
var ui = {tab:"home", open:-1, finish:false, cal:false, backupText:"", msg:""};

/* ========== 工具 ========== */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function two(n){ return (n<10?"0":"")+n; }
function fmt(t){ var d=new Date(t); return (d.getMonth()+1)+"月"+d.getDate()+"日 "+two(d.getHours())+":"+two(d.getMinutes()); }
function clock(ms){ var s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60); return (h?h+":":"")+two(m)+":"+two(s%60); }
function activeMs(){ var x=S.sess; if(!x) return 0; return Math.min(LIMIT, x.accum + (x.since ? Date.now()-x.since : 0)); }
function atts(L,P){ return S.attempts.filter(function(a){return a.L===L && (P==null || a.P===P);}); }
function pkgDone(L,P){ return atts(L,P).length>0; }
function pctTxt(a){ return a.total>0 ? a.correct+"/"+a.total : "—"; }

/* 关卡状态 */
function lvStatus(i){
  var lv=LV[i], done=0, k;
  for(k=0;k<lv.pkgs.length;k++) if(pkgDone(i,lv.pkgs[k].id)) done++;
  var allDone = done===lv.pkgs.length;
  var autoOk=true, recent=[];
  if(lv.auto){
    var list = S.attempts.filter(function(a){return a.L===i && lv.auto.pk.indexOf(a.P)>=0 && a.total>0;}).sort(function(a,b){return a.end-b.end;});
    recent = list.slice(-lv.auto.need);
    autoOk = recent.length>=lv.auto.need && recent.every(function(a){return a.correct/a.total >= lv.auto.ratio-1e-9;});
  }
  var mk = S.manual[i]||[], manualOk = lv.manual.every(function(_,j){return !!mk[j];});
  return {done:done, allDone:allDone, autoOk:autoOk, recent:recent, manualOk:manualOk, passed: allDone && autoOk && manualOk};
}
function curLevel(){ for(var i=0;i<LV.length;i++) if(!lvStatus(i).passed) return i; return LV.length; }
function nextPkg(L){ var lv=LV[L]; for(var k=0;k<lv.pkgs.length;k++) if(!pkgDone(L,lv.pkgs[k].id)) return k; return -1; }

/* ========== 学习计时 ========== */
function startPkg(L,k){
  if(S.sess) return;
  S.sess = {L:L, P:LV[L].pkgs[k].id, start:Date.now(), accum:0, since:Date.now(), beat:Date.now()};
  ui.finish=false; save(); render();
}
function pauseSess(){ var x=S.sess; if(!x||!x.since) return; x.accum = Math.min(LIMIT, x.accum + Date.now()-x.since); x.since=null; save(); render(); }
function resumeSess(){ var x=S.sess; if(!x||x.since||x.accum>=LIMIT) return; x.since=Date.now(); x.beat=Date.now(); save(); render(); }
function discardSess(){ if(confirm("放弃本次学习？不会留下记录，也不会产生补课。")){ S.sess=null; ui.finish=false; save(); render(); } }
setInterval(function(){
  var x=S.sess;
  if(x && x.since){
    x.beat=Date.now();
    if(activeMs()>=LIMIT){ x.accum=LIMIT; x.since=null; save(); render(); alert("已满 2 小时，到点就停。请点“完成并记录”。"); return; }
    save();
  }
  var t=document.getElementById("tm"); if(t) t.textContent = clock(activeMs());
  var w=document.getElementById("wk"); if(w && S.wake){ var left=S.wake.end-Date.now(); w.textContent = clock(Math.max(0,left)); }
},1000);

function saveAttempt(){
  var x=S.sess; if(!x) return;
  var total=parseInt(document.getElementById("f-total").value,10), cor=parseInt(document.getElementById("f-cor").value,10);
  var mins=parseInt(document.getElementById("f-min").value,10);
  if(isNaN(total)) total=0; if(isNaN(cor)) cor=0; if(isNaN(mins)) mins=Math.round(activeMs()/60000);
  if(total<0||cor<0||cor>total){ alert("正确数不能大于题量，也不能为负数。"); return; }
  if(mins>120){ alert("每包上限 120 分钟，用时已按 120 分钟记录。"); mins=120; }
  var rs=[].slice.call(document.querySelectorAll("#f-rs input:checked")).map(function(e){return e.value;});
  S.attempts.push({id:Date.now(), L:x.L, P:x.P, start:x.start, end:Date.now(), mins:mins, total:total, correct:cor, reasons:rs, note:document.getElementById("f-note").value.trim()});
  S.sess=null; ui.finish=false; save(); render();
}

/* ========== 日历（只为用户选择的单个时段） ========== */
function icsDate(d){ return d.getFullYear()+two(d.getMonth()+1)+two(d.getDate())+"T"+two(d.getHours())+two(d.getMinutes())+"00"; }
function makeIcs(){
  var v=document.getElementById("cal-t").value; if(!v){ alert("请先选择开始时间。"); return; }
  var L=curLevel(), k=L<LV.length?nextPkg(L):-1;
  var title = L<LV.length && k>=0 ? "学习："+LV[L].name.split("：")[0]+" "+LV[L].pkgs[k].id+" "+LV[L].pkgs[k].name : "备考学习";
  var s=new Date(v), e=new Date(s.getTime()+LIMIT);
  var u=new Date(); var stamp=u.getUTCFullYear()+two(u.getUTCMonth()+1)+two(u.getUTCDate())+"T"+two(u.getUTCHours())+two(u.getUTCMinutes())+two(u.getUTCSeconds())+"Z";
  var body=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//kaobei-workbench//CN","BEGIN:VEVENT","UID:"+Date.now()+"@kaobei-workbench","DTSTAMP:"+stamp,"DTSTART:"+icsDate(s),"DTEND:"+icsDate(e),"SUMMARY:"+title,"DESCRIPTION:每包最多 120 分钟，到点就停。","END:VEVENT","END:VCALENDAR"].join("\r\n");
  dl("study.ics", body, "text/calendar");
}
function dl(name, text, type){
  var b=new Blob([text],{type:type+";charset=utf-8"}), a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
}

  else if(a==="open"){ var i=+el.getAttribute("data-i"); ui.open = ui.open===i?-1:i; }
  else if(a==="start"){ ui.tab="home"; startPkg(+el.getAttribute("data-l"), +el.getAttribute("data-k")); return; }
  else if(a==="pause"){ pauseSess(); return; }
  else if(a==="resume"){ resumeSess(); return; }
  else if(a==="finish"){ pauseSess(); ui.finish=true; }
  else if(a==="finish-cancel"){ ui.finish=false; }
  else if(a==="save-att"){ saveAttempt(); return; }
  else if(a==="discard"){ discardSess(); return; }
  else if(a==="cal-toggle"){ ui.cal=!ui.cal; }
  else if(a==="cal-make"){ makeIcs(); return; }
  else if(a==="travel"){ if(S.sess) pauseSess(); S.travel={since:Date.now()}; save(); }
  else if(a==="resume-study"){ S.travel=null; S.wake={start:Date.now(), end:Date.now()+15*60000}; save(); }
  else if(a==="wake-done"){ S.wake=null; save(); }
  else if(a==="del-att"){ if(confirm("删除这条记录？")){ var id=+el.getAttribute("data-id"); S.attempts=S.attempts.filter(function(x){return x.id!==id;}); save(); } }
  else if(a==="export"){ dl("kaobei-backup-"+new Date().toISOString().slice(0,10)+".json", JSON.stringify(S,null,2), "application/json"); return; }
  else if(a==="copy"){ var t=JSON.stringify(S); if(navigator.clipboard){ navigator.clipboard.writeText(t).then(function(){ui.msg="已复制。";render();},function(){ui.backupText=t;ui.msg="无法自动复制，已把内容放进下方文本框，请手动全选复制。";render();}); } else { ui.backupText=t; ui.msg="已把内容放进下方文本框，请手动全选复制。"; render(); } return; }
  else if(a==="import-text"){ doImport(document.getElementById("imp-t").value); return; }
  else if(a==="reset"){ if(confirm("确定清空全部数据？此操作不可恢复，建议先导出备份。")){ S=fresh(); save(); ui.msg="已清空。"; } }
  render();
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.getAttribute && el.getAttribute("data-act")==="manual"){
    var i=+el.getAttribute("data-i"), j=+el.getAttribute("data-j");
    S.manual[i]=S.manual[i]||[]; S.manual[i][j]=el.checked; save(); render(); return;
  }
  if(el.id==="imp" && el.files && el.files[0]){
    var r=new FileReader(); r.onload=function(){ doImport(String(r.result)); }; r.readAsText(el.files[0]);
  }
});
load(); render();
</script>
</body>
</html>
